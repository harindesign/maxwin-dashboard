<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맥스윈 통합 업무 대시보드</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            padding: 20px;
        }
        .header {
            background: #2c3e50;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .card h2 {
            font-size: 16px;
            margin-bottom: 15px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
            color: #2c3e50;
        }
        .today-box {
            font-size: 14px;
            color: #444;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .result-box {
            background: #eef2f7;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .label {
            font-size: 12px;
            color: #555;
            font-weight: bold;
        }
        .date {
            font-size: 17px;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 4px;
            text-align: center;
        }
        .sunday-notice {
            color: #e74c3c;
            font-size: 11px;
            font-weight: bold;
            display: block;
            margin-top: 4px;
        }
        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .doc-btn {
            background: #ffffff;
            border: 1.5px solid #00c73c;
            color: #008a28;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .doc-btn:hover {
            background: #00c73c;
            color: white;
        }
        .doc-btn.active {
            background: #2c3e50;
            border-color: #2c3e50;
            color: white;
        }
        .main-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            min-height: 750px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
        }
        .viewer-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .viewer-header a {
            font-size: 12px;
            color: #3498db;
            text-decoration: none;
            font-weight: normal;
        }
        .viewer-header a:hover {
            text-decoration: underline;
        }
        .viewer-body {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #fafafa;
            border: 1px dashed #ccc;
            border-radius: 8px;
            position: relative;
        }
        .viewer-placeholder {
            color: #888;
            font-size: 15px;
            text-align: center;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📱 맥스윈 통합 업무 대시보드</h1>
        <div id="clock" style="font-size: 14px;"></div>
    </div>

    <div class="container">
        <!-- 좌측 사이드바 -->
        <div class="sidebar">
            <!-- 요금 유지기간 계산기 -->
            <div class="card">
                <h2>🗓️ 요금 유지기간 계산기</h2>
                <div class="today-box" id="todayText">오늘 날짜: 로딩 중...</div>
                
                <div class="result-box">
                    <div class="label" id="label125">✨ 요금할인 유지기간</div>
                    <div class="date" id="target125">계산 중...</div>
                </div>

                <div class="result-box">
                    <div class="label" id="label187">✨ 공시지원금 유지기간</div>
                    <div class="date" id="target187">계산 중...</div>
                </div>
            </div>

            <!-- 자료 바로보기 버튼 -->
            <div class="card">
                <h2>📂 정책 및 자료 조회</h2>
                <div class="btn-list">
                    <button class="doc-btn" onclick="showSheet('doc1', '무선 정책', this)">
                        📄 무선 정책 <span>▶</span>
                    </button>
                    <button class="doc-btn" onclick="showSheet('doc2', '유선 신규정책 요약자료', this)">
                        📄 유선 신규정책 요약자료 <span>▶</span>
                    </button>
                    <button class="doc-btn" onclick="showSheet('doc3', '유선 신규정책 상세', this)">
                        📄 유선 신규정책 상세 <span>▶</span>
                    </button>
                    <button class="doc-btn" onclick="showSheet('doc4', '유선 약정갱신', this)">
                        📄 유선 약정갱신 <span>▶</span>
                    </button>
                    <button class="doc-btn" onclick="showSheet('doc5', '무선 포인트표', this)">
                        📄 무선 포인트표 <span>▶</span>
                    </button>
                    <button class="doc-btn" onclick="showSheet('doc6', '유선 포인트표', this)">
                        📄 유선 포인트표 <span>▶</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 우측 메인 콘텐츠 -->
        <div class="main-content">
            <div class="viewer-header">
                <span id="docTitle">자료를 선택해 주세요</span>
                <a id="sheetDirectLink" href="https://docs.google.com/spreadsheets/d/14N4Odm1NfiaSk5-a7_Sldls9Fm3CM1t0wFwT4F6RA-g/edit?usp=sharing" target="_blank" style="display:none;">🔗 구글 시트에서 수정하기</a>
            </div>
            <div class="viewer-body" id="docContent">
                <div class="viewer-placeholder">
                    👈 왼쪽 메뉴에서 확인하실 정책 자료 버튼을 클릭하세요.
                </div>
            </div>
        </div>
    </div>

    <script>
        const SPREADSHEET_ID = "14N4Odm1NfiaSk5-a7_Sldls9Fm3CM1t0wFwT4F6RA-g";

        // 시트별 gid 지정
        const sheetGids = {
            doc1: '0',           // 무선 정책
            doc2: '232998545',   // 유선 신규정책 요약자료
            doc3: '1240839869',  // 유선 신규정책 상세
            doc4: '1690749568',  // 유선 약정갱신
            doc5: '617883450',   // 무선 포인트표
            doc6: '554077223'    // 유선 포인트표
        };

        function calculateDates() {
            const today = new Date();
            const dayOfWeek = today.getDay();

            const addDays1 = (dayOfWeek === 0) ? 126 : 125;
            const addDays2 = (dayOfWeek === 0) ? 188 : 187;

            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
            const todayString = `${year}년 ${month}월 ${day}일 (${weekdays[dayOfWeek]})`;
            
            let todayHtml = `<b>오늘:</b> ${todayString}`;
            if (dayOfWeek === 0) {
                todayHtml += `<span class="sunday-notice">📌 일요일 개통 휴무 반영 (+1일 가산)</span>`;
            }
            document.getElementById('todayText').innerHTML = todayHtml;

            document.getElementById('label125').innerText = `✨ 요금할인 (${addDays1}일 적용)`;
            document.getElementById('label187').innerText = `✨ 공시지원금 (${addDays2}일 적용)`;

            const date1 = new Date(today);
            date1.setDate(today.getDate() + addDays1);
            document.getElementById('target125').innerText = formatDate(date1);

            const date2 = new Date(today);
            date2.setDate(today.getDate() + addDays2);
            document.getElementById('target187').innerText = formatDate(date2);
        }

        function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
            return `${y}년 ${m}월 ${d}일 (${weekdays[date.getDay()]})`;
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('ko-KR');
        }
        setInterval(updateClock, 1000);
        updateClock();

        function showSheet(docKey, title, btnElement) {
            const buttons = document.querySelectorAll('.doc-btn');
            buttons.forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            const titleEl = document.getElementById('docTitle');
            const contentEl = document.getElementById('docContent');
            const linkEl = document.getElementById('sheetDirectLink');

            titleEl.innerText = title;
            linkEl.style.display = "inline";

            const gid = sheetGids[docKey] || '0';
            const embedUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/htmlembed?gid=${gid}&widget=false&chrome=false`;

            contentEl.innerHTML = `<iframe src="${embedUrl}"></iframe>`;
        }

        calculateDates();
    </script>

</body>
</html>
