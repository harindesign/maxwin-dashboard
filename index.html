<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맥스윈 통합 업무 대시보드</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            padding: 16px;
            line-height: 1.4;
        }
        .header {
            background: #2c3e50;
            color: white;
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .header h1 {
            font-size: 18px;
            font-weight: 700;
        }
        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 16px;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .card h2 {
            font-size: 15px;
            margin-bottom: 12px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 6px;
            color: #2c3e50;
        }
        .today-box {
            font-size: 13px;
            color: #444;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .result-box {
            background: #eef2f7;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .result-box:last-child {
            margin-bottom: 0;
        }
        .label {
            font-size: 11px;
            color: #555;
            font-weight: bold;
        }
        .date {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 2px;
            text-align: center;
        }
        .sunday-notice {
            color: #e74c3c;
            font-size: 11px;
            font-weight: bold;
            display: block;
            margin-top: 4px;
        }
        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .doc-btn {
            background: #ffffff;
            border: 1.5px solid #00c73c;
            color: #008a28;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .doc-btn:hover, .doc-btn:active {
            background: #00c73c;
            color: white;
        }
        .doc-btn.active {
            background: #2c3e50;
            border-color: #2c3e50;
            color: white;
        }
        .main-content {
            background: white;
            padding: 16px;
            border-radius: 12px;
            min-height: 700px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        .viewer-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #2c3e50;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .action-btns {
            display: flex;
            gap: 6px;
        }
        .action-btn {
            font-size: 12px;
            color: #3498db;
            text-decoration: none;
            font-weight: normal;
            background: #f0f7fc;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #cce4f7;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .action-btn:hover {
            background: #e1f0fa;
        }
        .action-btn.zoom-btn {
            background: #27ae60;
            color: white;
            border-color: #27ae60;
            font-weight: bold;
        }
        .action-btn.zoom-btn:hover {
            background: #219150;
        }
        .viewer-body {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #fafafa;
            border: 1px dashed #ccc;
            border-radius: 8px;
            position: relative;
            min-height: 550px;
        }
        .viewer-placeholder {
            color: #888;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 6px;
            min-height: 650px;
        }

        /* 🔍 풀스크린 핀치 & 버튼 줌 팝업 모달 */
        .zoom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 99999;
            flex-direction: column;
        }
        .zoom-modal-header {
            background: #1a252f;
            color: white;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ctrl-btn {
            background: #34495e;
            color: white;
            border: 1px solid #5d6d7e;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .ctrl-btn:active {
            background: #5d6d7e;
        }
        .zoom-scale-text {
            font-size: 13px;
            color: #2ecc71;
            font-weight: bold;
            min-width: 48px;
            text-align: center;
        }
        .close-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
        }
        .zoom-modal-body {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #525659;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            display: block;
            position: relative;
        }
        .zoom-frame-container {
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
            transition: transform 0.15s ease-out;
        }
        .zoom-frame-container iframe {
            width: 100%;
            height: 100%;
            min-height: 100vh;
        }

        /* 📱 모바일/태블릿 맞춤 화면 최적화 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .header {
                flex-direction: column;
                gap: 6px;
                text-align: center;
                padding: 12px;
            }
            .header h1 {
                font-size: 16px;
            }
            .container {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .card {
                padding: 14px;
            }
            .doc-btn {
                padding: 12px 14px;
                font-size: 14px;
            }
            .main-content {
                padding: 12px;
                min-height: 500px;
            }
            .viewer-header {
                font-size: 14px;
            }
            iframe {
                min-height: 480px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📱 맥스윈 통합 업무 대시보드</h1>
        <div id="clock" style="font-size: 13px;"></div>
    </div>

    <div class="container">
        <!-- 좌측 사이드바 -->
        <div class="sidebar">
            <!-- 요금 유지기간 계산기 -->
            <div class="card">
                <h2>🗓️ 요금 유지기간 계산기</h2>
                <div class="today-box" id="todayText">오늘 날짜: 로딩 중...</div>
                
                <div class="result-box">
                    <div class="label" id="label125">✨ 요금할인 유지기간</div>
                    <div class="date" id="target125">계산 중...</div>
                </div>

                <div class="result-box">
                    <div class="label" id="label187">✨ 공시지원금 유지기간</div>
                    <div class="date" id="target187">계산 중...</div>
                </div>
            </div>

            <!-- 자료 바로보기 버튼 -->
            <div class="card">
                <h2>📂 정책 및 자료 조회</h2>
                <div class="btn-list">
                    <button class="doc-btn" onclick="showSheet('doc1', '무선 정책', this)">
                        📄 무선 정책 <span>▶</span>
                    </button>
                    <button class="doc-btn" onclick="showSheet('doc2', '유선 신규정책 요약자료', this)">
                        📄 유선 신규정책 요약자료 <span>▶</span>
                    </button>
                    <button class="doc-btn" onclick="showSheet('doc3', '유선 신규정책 상세', this)">
                        📄 유선 신규정책 상세 <span>▶</span>
                    </button>
                    <button class="doc-btn" onclick="showSheet('doc4', '유선 약정갱신', this)">
                        📄 유선 약정갱신 <span>▶</span>
                    </button>
                    <button class="doc-btn" onclick="showSheet('doc5', '무선 포인트표', this)">
                        📄 무선 포인트표 <span>▶</span>
                    </button>
                    <button class="doc-btn" onclick="showSheet('doc6', '유선 포인트표', this)">
                        📄 유선 포인트표 <span>▶</span>
                    </button>
                    <button class="doc-btn" onclick="showSheet('doc7', '인센티브표', this)">
                        📄 인센티브표 <span>▶</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 우측 메인 콘텐츠 -->
        <div class="main-content">
            <div class="viewer-header">
                <span id="docTitle">자료를 선택해 주세요</span>
                <div class="action-btns" id="headerActions" style="display:none;">
                    <button class="action-btn zoom-btn" onclick="openZoomModal()">🔍 크게보기 / 줌조절</button>
                    <a id="sheetDirectLink" class="action-btn" href="https://docs.google.com/spreadsheets/d/14N4Odm1NfiaSk5-a7_Sldls9Fm3CM1t0wFwT4F6RA-g/edit?usp=sharing" target="_blank">🔗 구글 시트 앱에서 열기</a>
                </div>
            </div>
            <div class="viewer-body" id="docContent">
                <div class="viewer-placeholder">
                    👈 메뉴에서 확인하실 정책 자료를 선택해 주세요.
                </div>
            </div>
        </div>
    </div>

    <!-- 🔍 확대/축소 지원 풀스크린 팝업 모달 -->
    <div class="zoom-modal" id="zoomModal">
        <div class="zoom-modal-header">
            <span id="modalTitle">정책 자료 상세보기</span>
            <div class="zoom-controls">
                <button class="ctrl-btn" onclick="zoomChange(-0.1)">➖ 축소</button>
                <span class="zoom-scale-text" id="zoomScaleText">100%</span>
                <button class="ctrl-btn" onclick="zoomChange(0.1)">➕ 확대</button>
                <button class="ctrl-btn" onclick="zoomReset()">🔄 원본</button>
            </div>
            <button class="close-btn" onclick="closeZoomModal()">✕ 닫기</button>
        </div>
        <div class="zoom-modal-body" id="modalBody">
            <div class="zoom-frame-container" id="zoomContainer">
                <!-- 시트 iframe -->
            </div>
        </div>
    </div>

    <script>
        const SPREADSHEET_ID = "14N4Odm1NfiaSk5-a7_Sldls9Fm3CM1t0wFwT4F6RA-g";

        const sheetGids = {
            doc1: '0',           // 무선 정책
            doc2: '232998545',   // 유선 신규정책 요약자료
            doc3: '1240839869',  // 유선 신규정책 상세
            doc4: '1690749568',  // 유선 약정갱신
            doc5: '617883450',   // 무선 포인트표
            doc6: '554077223',   // 유선 포인트표
            doc7: '1222486188'   // 인센티브표
        };

        let currentGid = '0';
        let currentTitle = '';
        let currentScale = 1.0;

        function calculateDates() {
            const today = new Date();
            const dayOfWeek = today.getDay();

            const addDays1 = (dayOfWeek === 0) ? 126 : 125;
            const addDays2 = (dayOfWeek === 0) ? 188 : 187;

            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
            const todayString = `${year}년 ${month}월 ${day}일 (${weekdays[dayOfWeek]})`;
            
            let todayHtml = `<b>오늘:</b> ${todayString}`;
            if (dayOfWeek === 0) {
                todayHtml += `<span class="sunday-notice">📌 일요일 개통 휴무 반영 (+1일 가산)</span>`;
            }
            document.getElementById('todayText').innerHTML = todayHtml;

            document.getElementById('label125').innerText = `✨ 요금할인 (${addDays1}일 적용)`;
            document.getElementById('label187').innerText = `✨ 공시지원금 (${addDays2}일 적용)`;

            const date1 = new Date(today);
            date1.setDate(today.getDate() + addDays1);
            document.getElementById('target125').innerText = formatDate(date1);

            const date2 = new Date(today);
            date2.setDate(today.getDate() + addDays2);
            document.getElementById('target187').innerText = formatDate(date2);
        }

        function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
            return `${y}년 ${m}월 ${d}일 (${weekdays[date.getDay()]})`;
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('ko-KR');
        }
        setInterval(updateClock, 1000);
        updateClock();

        function showSheet(docKey, title, btnElement) {
            const buttons = document.querySelectorAll('.doc-btn');
            buttons.forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            currentTitle = title;
            currentGid = sheetGids[docKey] || '0';

            document.getElementById('docTitle').innerText = title;
            document.getElementById('headerActions').style.display = "flex";

            const embedUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/htmlembed?gid=${currentGid}&widget=false&chrome=false`;

            document.getElementById('docContent').innerHTML = `<iframe src="${embedUrl}"></iframe>`;
        }

        function openZoomModal() {
            if(!currentGid) return;
            const embedUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/htmlembed?gid=${currentGid}&widget=false&chrome=false`;
            
            document.getElementById('modalTitle').innerText = `📄 ${currentTitle}`;
            document.getElementById('zoomContainer').innerHTML = `<iframe src="${embedUrl}"></iframe>`;
            document.getElementById('zoomModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
            zoomReset();
        }

        function closeZoomModal() {
            document.getElementById('zoomModal').style.display = 'none';
            document.getElementById('zoomContainer').innerHTML = '';
            document.body.style.overflow = 'auto';
        }

        function zoomChange(delta) {
            currentScale = Math.min(Math.max(0.3, currentScale + delta), 2.0);
            applyZoom();
        }

        function zoomReset() {
            currentScale = 1.0;
            applyZoom();
        }

        function applyZoom() {
            const container = document.getElementById('zoomContainer');
            container.style.transform = `scale(${currentScale})`;
            
            // 배율에 따라 프레임 너비/높이 보정
            container.style.width = `${100 / currentScale}%`;
            container.style.height = `${100 / currentScale}%`;

            document.getElementById('zoomScaleText').innerText = `${Math.round(currentScale * 100)}%`;
        }

        calculateDates();
    </script>

</body>
</html>
